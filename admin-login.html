<!DOCTYPE html>
<html lang="fa" dir="rtl" data-v="3">
<head>
  <meta charset="UTF-8" />
  <script>
    /* ===== AUTO-UPDATE (frozen code — only data-v bumps, once per deploy) =====
       This document carries data-v = build number. On load, every 5 minutes,
       and whenever the tab becomes visible, re-fetch our own page with the
       HTTP cache bypassed; if the server's build is NEWER, replace the URL
       with a cache-busted query → fresh HTML + fresh ?v= assets reload with a
       single blink the user never thinks about. Builds only ever grow, so even
       a lagging CDN edge can never cause a reload loop. Offline or old
       browsers (no fetch) fail silently — the page just keeps running. */
    (function () {
      function check() {
        if (!window.fetch || !location.pathname) return;
        var cur = parseInt(document.documentElement.getAttribute("data-v"), 10);
        if (!(cur >= 0)) cur = 0;
        fetch(location.pathname + "?_nc=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (t) {
            var m = t.match(/<html[^>]*\bdata-v="(\d+)"/);
            var next = m ? parseInt(m[1], 10) : -1;
            if (next > cur) location.replace(location.pathname + "?_v=" + next + location.hash);
          })
          .catch(function () { });
      }
      check();
      setInterval(check, 300000);
      document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ورود مدیریت | ZEUSSHOP</title>
  <link rel="icon" type="image/png" href="image/fav.png" />
  <link rel="stylesheet" href="css/fonts.css?v=87" />
  <link rel="stylesheet" href="css/style.css?v=121" />
  <link rel="stylesheet" href="css/admin.css?v=100" />
</head>
<body class="login">
  <main class="login__wrap">
    <div class="login__brand">
      <a href="index.html" class="logo">
        <img class="logo__img" src="image/logo.png" alt="ZEUSSHOP" />
        <span>ZEUS<b>SHOP</b> <small data-i18n="loginBrand">ورود مدیریت</small></span>
      </a>
    </div>

    <form class="login__card" id="loginForm" novalidate>
      <h1 class="login__title" data-i18n="loginTitle">ورود به پنل مدیریت</h1>
      <p class="login__sub" data-i18n="loginSub">برای مدیریت اسکین‌ها و سفارش‌ها وارد شوید.</p>

      <div class="field">
        <label class="field-label" for="adminUser">نام کاربری مدیریت</label>
        <input class="field-input" type="text" id="adminUser" dir="ltr" autocomplete="username" placeholder="admin" />
      </div>

      <div class="field">
        <label class="field-label" for="adminPass" data-i18n="loginPass">رمز عبور</label>
        <input class="field-input" type="password" id="adminPass" dir="ltr" autocomplete="current-password" placeholder="••••••" />
      </div>

      <div class="login__err" id="loginErr" role="alert"></div>

      <button class="btn btn--primary btn--block" type="submit" id="loginBtn" data-i18n="loginBtn">ورود</button>
    </form>

    <a href="index.html" class="login__back" data-i18n="loginBack">← بازگشت به فروشگاه</a>
  </main>

  <script src="js/supabase.min.js?v=1"></script>
  <script src="js/supabase-config.js?v=89"></script>
  <script src="js/db.js?v=120"></script>
  <script src="js/main.js?v=139"></script>
  <script src="js/admin.js?v=122"></script>
</body>
</html>
